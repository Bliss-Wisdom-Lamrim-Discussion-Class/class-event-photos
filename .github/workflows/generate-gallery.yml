name: Auto Generate Gallery Thumbnails & Organize Folders

on:
  push:
    branches:
      - main
    paths:
      - 'photos/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Run Gallery Generator & Organizer
        run: |
          python scripts/generate_gallery.py

      - name: Commit and Push generated thumbnails & data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 [skip ci] [Automated] 自動歸檔照片至日期目錄、生成縮圖與更新相簿 JSON"
          file_pattern: "photos/** thumbnails/** gallery-data.json"
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"
          github_token: ${{ secrets.GITHUB_TOKEN }}
