name: Auto Generate Gallery Thumbnails & Data

on:
  push:
    branches:
      - main
    paths:
      - 'photos/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 取得完整 git 歷史以解析 commit 紀錄

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Run Gallery Generator
        run: |
          python scripts/generate_gallery.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 [Automated] 自動生成照片縮圖與更新相簿 JSON 數據"
          file_pattern: "thumbnails/* gallery-data.json"
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"
